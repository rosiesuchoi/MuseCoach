<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muse">
<meta name="theme-color" content="#e8457c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<script src="local-backend.js"></script>
<title>Muse Coach</title>
<style>
  :root { --pink:#e8457c; --ink:#2a1f26; --soft:#fff7fa; --card:#fff; --line:#f1d9e2; --mute:#8a7580; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:var(--soft); color:var(--ink);
         padding:16px 16px calc(84px + env(safe-area-inset-bottom)); max-width:520px; margin-inline:auto; }
  h1 { font-size:22px; margin:4px 0 12px; } h2 { font-size:16px; margin:18px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .big { font-size:34px; font-weight:700; } .mute { color:var(--mute); font-size:13px; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--pink); width:0; transition:width .3s; }
  button, .btn { background:var(--pink); color:#fff; border:0; border-radius:12px; padding:12px 16px;
                 font-size:16px; font-weight:600; width:100%; display:block; text-align:center; cursor:pointer; }
  button.ghost { background:transparent; color:var(--pink); border:1px solid var(--pink); }
  button.small { width:auto; padding:6px 10px; font-size:13px; }
  label { display:block; font-size:13px; color:var(--mute); margin:10px 0 4px; }
  input, select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .meal { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .meal:first-child { border-top:0; }
  .meal > div:last-child:not(.row) { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom); max-width:520px; margin:auto; }
  nav button { background:none; color:var(--mute); border-radius:0; padding:14px 4px; font-size:14px; }
  nav button.on { color:var(--pink); }
  .note { background:#fff1c9; border-radius:10px; padding:8px 10px; font-size:13px; margin-top:8px; }
  .err { background:#ffd9d9; border-radius:10px; padding:8px 10px; font-size:14px; margin:8px 0; }
  a { color:var(--pink); } .hide { display:none; }
  .day { font-weight:700; margin-top:10px; }
  .carousel { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity; padding:4px 2px 10px;
              -webkit-overflow-scrolling:touch; margin:0 -16px; padding-inline:16px; }
  .cc { flex:0 0 96px; scroll-snap-align:start; background:none; border:0; padding:0; color:var(--ink); display:flex;
        flex-direction:column; align-items:center; gap:6px; width:96px; font-weight:400; }
  .ph { width:84px; height:84px; border-radius:50%; background:var(--line); overflow:hidden; display:flex; align-items:center;
        justify-content:center; font-weight:700; color:var(--pink); font-size:24px; border:3px solid transparent; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc.on .ph { border-color:var(--pink); box-shadow:0 0 0 2px #fff inset; }
  .cc.on .cn { color:var(--pink); font-weight:700; }
  .cn { font-size:13px; line-height:1.2; text-align:center; } .cd { font-size:11px; color:var(--mute); line-height:1.2; text-align:center; }
  .chip { background:#fff; color:var(--ink); border:1px solid var(--line); text-align:left; font-weight:400; margin-bottom:8px; font-size:14px; }
  .chip.on { border-color:var(--pink); background:#fff1f6; }
</style>
</head>
<body>
<div id="app"></div>
<nav>
  <button data-tab="today" class="on">Today</button>
  <button data-tab="coach">Coach</button>
  <button data-tab="plan">Meal plan</button>
  <button data-tab="me">Me</button>
</nav>
<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
let state = null, tab = "today", celebs = [], busy = "", editing = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || "Something went wrong.");
  return body;
}
const json = (method, data) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
// The server and storage stay metric; the screen is US units (ft/in, lb, calories).
const LB_PER_KG = 2.2046226, CM_PER_IN = 2.54;
const kgToLb = kg => Math.round(kg * LB_PER_KG * 10) / 10;
const lbToKg = lb => Math.round(lb / LB_PER_KG * 100) / 100; // 2 decimals so lb round-trips without drift
const cmToFtIn = cm => { const t = Math.round(cm / CM_PER_IN); return { ft: Math.floor(t / 12), inch: t % 12 }; };
const ftInToCm = (ft, inch) => Math.round((ft * 12 + inch) * CM_PER_IN * 100) / 100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  let opts;
  [state, opts] = await Promise.all([api("/api/state"), api("/api/options")]);
  celebs = opts.celebrities; styles = opts.styles;
  render();
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!state.profile) { app.innerHTML = setupHtml(); wireSetup(); return; }
  ({ today: renderToday, coach: renderCoach, plan: renderPlan, me: () => { app.innerHTML = setupHtml(state.profile); wireSetup(); } })[tab]();
}

function renderToday() {
  const { plan, eaten_kcal, remaining_kcal, meals, message } = state;
  const pct = Math.min(100, Math.round(eaten_kcal / plan.target_kcal * 100));
  app.innerHTML = `
    <h1>Today</h1>
    <div class="card">
      <div class="mute">Eaten / target</div>
      <div class="big">${eaten_kcal} <span class="mute">/ ${plan.target_kcal} cal</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="mute">${remaining_kcal >= 0 ? remaining_kcal + " left" : -remaining_kcal + " over"} · P ${plan.protein_g}g · C ${plan.carbs_g}g · F ${plan.fat_g}g</div>
    </div>
    <div class="card"><div>${esc(message)}</div></div>
    <label class="btn" for="photo">${busy || "📷 Log a meal with a photo"}</label>
    <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
    <div id="err"></div>
    <h2>Add by hand</h2>
    <div class="row"><input id="mname" placeholder="Meal"><input id="mkcal" type="number" inputmode="numeric" placeholder="Calories"></div>
    <button class="ghost" id="addbtn" style="margin-top:8px">Add</button>
    <h2>Logged today</h2>
    <div class="card">${meals.length ? meals.map(m => editing === m.id ? `
      <div class="meal" style="display:block"><div class="row"><input id="ename" value="${esc(m.name)}" maxlength="80">
      <input id="ekcal" type="number" inputmode="numeric" value="${m.kcal}"></div>
      <div class="row" style="margin-top:8px"><button class="small" id="esave">Save</button><button class="small ghost" id="ecancel">Cancel</button></div></div>` : `
      <div class="meal"><div>${esc(m.name)}<div class="mute">${m.source === "photo" ? "photo estimate (approximate)" : "manual"}</div></div>
      <div>${m.kcal} <button class="small ghost" data-edit="${m.id}" aria-label="Edit">✎</button> <button class="small ghost" data-del="${m.id}" aria-label="Delete">✕</button></div></div>`).join("") : '<span class="mute">Nothing yet.</span>'}</div>`;
  $("#photo").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    busy = "Estimating…"; renderToday();
    const fd = new FormData(); fd.append("photo", f);
    try {
      const r = await api("/api/meals/photo", { method: "POST", body: fd });
      state = r; busy = ""; renderToday();
      const est = r.estimate;
      if (est.demo) showErr("Demo estimate: set ANTHROPIC_API_KEY on the server for real photo estimates.");
      else if (est.method === "on-device") showNote(`Looks like ${est.meal_name.toLowerCase()}. This is about one typical serving (${est.serving}), worked out on your device. If your portion was different, tap ✎ to adjust.`);
      else if (est.confidence === "low") showErr("Low confidence estimate. Tap ✎ to fix it if it looks off.");
    } catch (err) { busy = ""; renderToday(); showErr(err.message); }
  };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = +b.dataset.edit; renderToday(); });
  if ($("#esave")) {
    $("#ecancel").onclick = () => { editing = null; renderToday(); };
    $("#esave").onclick = async () => {
      const name = $("#ename").value.trim(), kcal = parseInt($("#ekcal").value, 10);
      if (!name || isNaN(kcal)) return showErr("Enter a meal name and calories.");
      try { state = await api("/api/meals/" + editing, json("PATCH", { name, kcal })); editing = null; renderToday(); } catch (err) { showErr(err.message); }
    };
  }
  $("#addbtn").onclick = async () => {
    const name = $("#mname").value.trim(), kcal = parseInt($("#mkcal").value, 10);
    if (!name || isNaN(kcal)) return showErr("Enter a meal name and calories.");
    try { state = await api("/api/meals", json("POST", { name, kcal })); renderToday(); } catch (err) { showErr(err.message); }
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    state = await api("/api/meals/" + b.dataset.del, { method: "DELETE" }); renderToday();
  });
}
function showErr(msg) { const e = $("#err"); if (e) e.innerHTML = `<div class="err">${esc(msg)}</div>`; }
function showNote(msg) { const e = $("#err"); if (e) e.innerHTML = `<div class="note">${esc(msg)}</div>`; }
// The web edition reports model download / analysis progress while a photo is being processed.
window.addEventListener("muse-status", e => {
  if (!busy) return;
  busy = e.detail;
  const l = document.querySelector("label.btn"); if (l) l.textContent = busy;
});

function renderCoach() {
  const c = state.coach, p = state.plan;
  app.innerHTML = `
    <h1>${esc(c.coach)}</h1>
    <div class="mute">${esc(c.tagline)}${state.profile.celebrity ? " · style target: " + esc(state.profile.celebrity) : ""}</div>
    <div class="card"><b>Your plan</b><br>${p.target_kcal} calories/day (maintenance ${p.maintenance_kcal}).
      ${p.weekly_change_kg ? `Expected change: ${p.weekly_change_kg > 0 ? "+" : ""}${kgToLb(p.weekly_change_kg)} lb/week${p.weeks_to_goal ? ", about " + p.weeks_to_goal + " weeks to " + Math.round(kgToLb(p.goal_weight_kg)) + " lb" : ""}.` : "Holding steady."}
      ${p.notes.map(n => `<div class="note">${esc(n)}</div>`).join("")}</div>
    <div class="card"><b>Training style</b><br>${esc(c.style)}</div>
    <h2>This week</h2><div class="card">${c.week.map(d => `<div class="meal">${esc(d)}</div>`).join("")}</div>
    <h2>Tips</h2><div class="card">${c.tips.map(t => `<div class="meal">${esc(t)}</div>`).join("")}</div>
    <p class="mute">The celebrity you pick only chooses a coach style. Your targets come from your own body and are kept within healthy limits. This isn't medical advice.</p>`;
}

async function renderPlan() {
  app.innerHTML = "<h1>Meal plan</h1><p class='mute'>Loading…</p>";
  const { week, target_kcal } = await api("/api/mealplan");
  app.innerHTML = `<h1>Meal plan</h1><p class="mute">Real recipes from the web, with portions scaled to your ${target_kcal} calories. Tap to open.</p>` +
    week.map(d => `<div class="card"><div class="day">${d.day}</div>${d.meals.map(m => `
      <div class="meal"><div><span class="mute">${m.slot}</span><br><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a>
      <div class="mute">${esc(m.source)} · ${m.servings}× serving</div></div><div>${m.kcal}</div></div>`).join("")}
      <div class="mute" style="margin-top:6px">Snacks: ~${d.snack_budget} calories</div></div>`).join("");
}

// ---- celebrity picker: carousel of Wikipedia portraits + name search ----
let styles = [], pick = { name: "", style: "" }, extraCelebs = [], photos = {};
const isListed = name => celebs.some(c => c.name === name);
const safeThumb = u => (typeof u === "string" && /^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u)) ? u : "";
const PERSON = /born \d{4}|actor|actress|singer|model|rapper|dancer|athlete|player|presenter|personality|musician|wrestler|boxer|idol|comedian|influencer|businesswoman|businessman/i;
const WIKI = "https://en.wikipedia.org/w/api.php?";

async function wikiThumbs(titles) {
  const need = titles.filter(t => !(t in photos));
  if (!need.length) return;
  try {
    const r = await fetch(WIKI + new URLSearchParams({ action: "query", titles: need.join("|"), prop: "pageimages", piprop: "thumbnail",
      pithumbsize: "240", redirects: "1", format: "json", origin: "*" }));
    const q = (await r.json()).query || {};
    const hop = {}; // requested title -> final page title (Wikipedia normalizes and redirects)
    [...(q.normalized || []), ...(q.redirects || [])].forEach(m => { hop[m.from] = m.to; });
    const byTitle = {}; Object.values(q.pages || {}).forEach(pg => { byTitle[pg.title] = safeThumb(pg.thumbnail && pg.thumbnail.source); });
    need.forEach(t => { let f = t, n = 0; while (hop[f] && n++ < 4) f = hop[f]; photos[t] = byTitle[f] || ""; });
  } catch { need.forEach(t => { photos[t] = ""; }); } // offline: initials fall back
}

async function wikiSearch(name) {
  const r = await fetch(WIKI + new URLSearchParams({ action: "query", generator: "search", gsrsearch: name, gsrlimit: "10", prop: "pageimages|description",
    piprop: "thumbnail", pithumbsize: "240", format: "json", origin: "*" }));
  const pages = Object.values(((await r.json()).query || {}).pages || {}).sort((a, b) => a.index - b.index);
  return pages.filter(pg => safeThumb(pg.thumbnail && pg.thumbnail.source) && PERSON.test(pg.description || "")).slice(0, 5)
    .map(pg => ({ name: pg.title, wiki: pg.title, desc: pg.description || "", thumb: safeThumb(pg.thumbnail.source) }));
}

const initials = n => esc(n.replace(/\(.*\)/, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase());
function cardHtml(c, i, on) {
  const img = photos[c.wiki] || c.thumb;
  return `<button type="button" class="cc ${on ? "on" : ""}" data-i="${i}"><span class="ph">${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : initials(c.name)}</span>
    <span class="cn">${esc(c.name)}</span>${c.desc ? `<span class="cd">${esc(c.desc)}</span>` : ""}</button>`;
}

function renderCarousel() {
  const el = $("#carousel"); if (!el) return;
  const all = [...extraCelebs, ...celebs];
  el.innerHTML = all.map((c, i) => cardHtml(c, i, c.name === pick.name)).join("");
  el.querySelectorAll(".cc").forEach(b => b.onclick = () => { pick.name = all[+b.dataset.i].name; renderCarousel(); renderStyleBox(); });
  const on = el.querySelector(".cc.on"); if (on) el.scrollTo({ left: on.offsetLeft - 16, behavior: "smooth" });
  renderStyleBox();
}

function renderStyleBox() {
  const el = $("#stylebox"); if (!el) return;
  if (!pick.name || isListed(pick.name)) { el.innerHTML = ""; return; }
  const cur = pick.style || "athletic";
  el.innerHTML = `<label>Which coach style fits ${esc(pick.name)}?</label>` + styles.map(s =>
    `<button type="button" class="chip ${s.key === cur ? "on" : ""}" data-s="${s.key}"><b>${esc(s.coach)}</b><br><span class="mute">${esc(s.tagline)}</span></button>`).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { pick.style = b.dataset.s; renderStyleBox(); });
}

async function findCelebrity() {
  const name = $("#csearch").value.trim(), out = $("#cresults"); if (!name) return;
  out.innerHTML = '<p class="mute">Searching…</p>';
  let hits = [];
  try { hits = await wikiSearch(name); } catch { out.innerHTML = '<div class="err">Couldn\'t search right now. Check your connection.</div>'; return; }
  if (!hits.length) {
    out.innerHTML = `<p class="mute">No photo found for "${esc(name)}". Try the full name, or use it without a photo.</p>
      <button type="button" class="ghost" id="usename">Use "${esc(name)}" anyway</button>`;
    $("#usename").onclick = () => { addCeleb({ name, wiki: name, thumb: "" }); out.innerHTML = ""; };
    return;
  }
  out.innerHTML = `<p class="mute">Tap the right one:</p><div class="carousel" id="hits">${hits.map((c, i) => cardHtml(c, i, false)).join("")}</div>`;
  out.querySelectorAll(".cc").forEach(b => b.onclick = () => { addCeleb(hits[+b.dataset.i]); out.innerHTML = ""; $("#csearch").value = ""; });
}
function addCeleb(c) {
  if (c.thumb) photos[c.wiki] = c.thumb;
  if (!isListed(c.name) && !extraCelebs.some(e => e.name === c.name)) extraCelebs.unshift(c);
  pick = { name: c.name, style: pick.style };
  renderCarousel();
}

function setupHtml(p = {}) {
  // Re-seed the picker from the saved profile (a saved name that isn't in the list shows as an extra card).
  pick = { name: p.celebrity || "", style: p.style || "" };
  if (pick.name && !isListed(pick.name) && !extraCelebs.some(e => e.name === pick.name)) extraCelebs.unshift({ name: pick.name, wiki: pick.name, thumb: "" });
  const sel = (v, o) => o.map(([k, t]) => `<option value="${k}" ${p[v] === k ? "selected" : ""}>${t}</option>`).join("");
  return `<h1>${p.age ? "Your profile" : "Welcome to Muse Coach"}</h1>
    <p class="mute">Pick a celebrity style you admire. A coach built for that style takes it from here.</p>
    <label>Style inspiration (swipe, then tap one)</label>
    <div id="carousel" class="carousel"></div>
    <label>Not here? Type a celebrity's name</label>
    <div class="row" style="align-items:stretch"><input id="csearch" placeholder="e.g. Gong Yoo" enterkeyhint="search"><button class="small" id="cfind" type="button" style="flex:0 0 auto">Find</button></div>
    <div id="cresults"></div>
    <div id="stylebox"></div>
    <p class="mute" style="margin:6px 0 0">Photos come from Wikipedia and Wikimedia Commons. The celebrity only picks your coach's style; your targets come from your own numbers.</p>
    <div class="row"><div><label>Age</label><input id="age" type="number" inputmode="numeric" value="${p.age || ""}"></div>
    <div><label>Sex (calorie formula)</label><select id="sex">${sel("sex", [["female", "Female"], ["male", "Male"]])}</select></div></div>
    <label>Height</label>
    <div class="row"><input id="ft" type="number" inputmode="numeric" placeholder="ft" value="${p.height_cm ? cmToFtIn(p.height_cm).ft : ""}">
    <input id="inch" type="number" inputmode="numeric" placeholder="in" value="${p.height_cm ? cmToFtIn(p.height_cm).inch : ""}"></div>
    <label>Weight (lb)</label><input id="weight" type="number" inputmode="decimal" value="${p.weight_kg ? kgToLb(p.weight_kg) : ""}">
    <label>Goal</label><select id="goal">${sel("goal", [["lose", "Lose fat"], ["maintain", "Maintain"], ["build", "Build muscle"]])}</select>
    <label>Goal weight (lb, optional)</label><input id="gw" type="number" inputmode="decimal" value="${p.goal_weight_kg ? kgToLb(p.goal_weight_kg) : ""}">
    <label>Activity</label><select id="act">${sel("activity", [["low", "Low (desk job, 1-3 workouts)"], ["medium", "Medium (3-5 workouts)"], ["high", "High (6-7 hard workouts)"]])}</select>
    ${window.museExtraHtml ? window.museExtraHtml() : ""}
    <div id="err"></div><button id="save" style="margin-top:14px">Save and meet my coach</button>`;
}
function wireSetup() {
  if (window.museWireExtra) window.museWireExtra();
  renderCarousel();
  wikiThumbs([...extraCelebs, ...celebs].map(c => c.wiki)).then(renderCarousel);
  $("#cfind").onclick = findCelebrity;
  $("#csearch").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); findCelebrity(); } };
  $("#save").onclick = async () => {
    const num = id => { const v = $(id).value; return v === "" ? null : parseFloat(v); };
    const ft = num("#ft"), inch = num("#inch") ?? 0, lb = num("#weight"), gwLb = num("#gw");
    const body = { age: parseInt($("#age").value, 10), sex: $("#sex").value, height_cm: ft === null ? null : ftInToCm(ft, inch),
      weight_kg: lb === null ? null : lbToKg(lb), goal: $("#goal").value, activity: $("#act").value,
      goal_weight_kg: gwLb === null ? null : lbToKg(gwLb), celebrity: pick.name, style: !pick.name || isListed(pick.name) ? "" : (pick.style || "athletic") };
    if ([body.age, body.height_cm, body.weight_kg].some(v => v === null || isNaN(v))) return showErr("Fill in age, height and weight.");
    try { state = await api("/api/profile", json("PUT", body)); tab = "coach"; render(); } catch (err) { showErr(err.message); }
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; if (state) render(); });
load();
</script>
</body>
</html>
