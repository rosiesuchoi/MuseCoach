name = "muse-coach-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Only this site may call the proxy from a browser.
ALLOWED_ORIGINS = "https://rosiesuchoi.github.io"
DAILY_LIMIT = "300"   # total model calls per day, all users (one meal analysis = 2 calls)
IP_LIMIT = "30"       # model calls per day, per visitor IP

# Create with:  npx wrangler kv namespace create LIMITS   then paste the id it prints.
[[kv_namespaces]]
binding = "LIMITS"
id = "PASTE_KV_NAMESPACE_ID_HERE"
