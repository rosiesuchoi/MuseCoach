<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muse">
<meta name="theme-color" content="#e8457c">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Muse Coach</title>
<style>
  :root {
    --pink:#e8457c; --pink2:#ff7aa8; --plum:#7a2d62;
    --grad:linear-gradient(135deg,#ff7aa8 0%,#e8457c 55%,#c93472 100%);
    --bg:#fff7fa; --card:#fff; --ink:#2a1f26; --mute:#7f6a76; --line:#f1d9e2; --field:#fff; --soft:#fff1f6;
    --warn:#fff1c9; --warn-line:#f0d98a; --good:#e4f6e8; --good-line:#b7e2c1; --bad:#fde6ea; --bad-line:#f5bcc8; --info:#eef0ff; --info-line:#cfd4f5;
    --shadow:0 6px 24px rgba(201,52,114,.10), 0 1px 3px rgba(42,31,38,.06);
    --radius:20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#150e18; --card:#231829; --ink:#f7ebf1; --mute:#b9a0ae; --line:#3b2b42; --field:#1c1322; --soft:#2d1d33;
      --warn:#3b3216; --warn-line:#6b5a22; --good:#173222; --good-line:#2f6a45; --bad:#3d1b27; --bad-line:#7b3347; --info:#1f2146; --info-line:#41457f;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; color:var(--ink);
         background:var(--bg); background-image:radial-gradient(900px 420px at 85% -120px,rgba(255,122,168,.28),transparent 70%),radial-gradient(700px 380px at -10% 0,rgba(122,45,98,.14),transparent 70%);
         background-repeat:no-repeat; background-attachment:fixed; line-height:1.4; }
  .shell { max-width:560px; margin-inline:auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)); }
  .skip { position:absolute; left:12px; top:-60px; z-index:200; background:var(--card); color:var(--ink); border:2px solid var(--pink); border-radius:12px; padding:10px 14px; font-weight:700; text-decoration:none; }
  .skip:focus { top:12px; }
  main:focus { outline:none; }
  h1 { font-size:28px; letter-spacing:-.5px; margin:6px 0 12px; line-height:1.15; }
  h2 { font-size:17px; margin:22px 0 10px; letter-spacing:-.2px; }
  .grad-text { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .top { display:flex; align-items:center; gap:10px; padding:calc(14px + env(safe-area-inset-top)) 0 6px; font-weight:800; letter-spacing:-.3px; font-size:17px; }
  .top svg { width:30px; height:30px; flex:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .big { font-size:34px; font-weight:800; letter-spacing:-1px; } .mute { color:var(--mute); font-size:13px; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--grad); width:0; transition:width .6s cubic-bezier(.2,.8,.2,1); }
  button, .btn { background:var(--grad); color:#fff; border:0; border-radius:14px; padding:14px 16px; font:inherit; font-size:16px; font-weight:700;
                 width:100%; display:block; text-align:center; cursor:pointer; box-shadow:0 6px 16px rgba(232,69,124,.28); transition:transform .12s, box-shadow .12s, opacity .2s; }
  button:active, .btn:active { transform:scale(.97); box-shadow:0 2px 8px rgba(232,69,124,.25); }
  button.ghost { background:transparent; color:var(--pink); border:1.5px solid var(--pink); box-shadow:none; }
  button.small { width:auto; padding:7px 11px; font-size:13px; border-radius:11px; box-shadow:none; }
  button:focus-visible, input:focus-visible, select:focus-visible, .btn:focus-visible { outline:3px solid rgba(232,69,124,.45); outline-offset:2px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 5px; font-weight:600; }
  input, select { width:100%; padding:13px; font-size:16px; border:1.5px solid var(--line); border-radius:12px; background:var(--field); color:var(--ink); }
  input:focus, select:focus { border-color:var(--pink); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .meal { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .meal:first-child { border-top:0; }
  .meal > div:last-child:not(.row) { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .note { background:var(--warn); border:1px solid var(--warn-line); border-radius:12px; padding:9px 11px; font-size:13px; margin-top:8px; }
  .err { background:var(--bad); border:1px solid var(--bad-line); border-radius:12px; padding:9px 11px; font-size:14px; margin:8px 0; }
  a { color:var(--pink); } .hide { display:none; }
  .day { font-weight:800; margin-top:6px; }

  /* bottom navigation */
  nav { position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; max-width:560px; margin:auto; gap:4px;
        padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--card) 86%, transparent);
        -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); border-top:1px solid var(--line); }
  nav button { flex:1; background:none; color:var(--mute); box-shadow:none; border-radius:14px; padding:7px 4px 6px; font-size:11.5px; font-weight:700;
               display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .2s, background .2s; }
  nav button svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
  nav button.on { color:var(--pink); background:var(--soft); } nav button.on svg { transform:translateY(-2px) scale(1.12); }

  /* entrance animation */
  #splash { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; cursor:pointer;
            background:linear-gradient(160deg,#ff9cc0 0%,#e8457c 52%,#9c2a69 100%); animation:splashOut .6s ease 1.9s forwards; }
  #splash .inner { position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #splash .halo { position:absolute; top:-8px; width:120px; height:120px; border-radius:50%; border:3px solid rgba(255,255,255,.55); opacity:0; animation:halo 1.5s ease-out .5s infinite; }
  #splash .mark { width:104px; height:104px; filter:drop-shadow(0 12px 22px rgba(80,10,50,.35)); animation:pop .9s cubic-bezier(.2,1.5,.4,1) both, beat 1.3s ease-in-out .9s 2; }
  #splash .word { font-size:34px; font-weight:800; letter-spacing:-1px; animation:rise .7s ease .35s both; }
  #splash .tag { font-size:15px; opacity:.9; letter-spacing:.5px; animation:rise .7s ease .6s both; }
  @keyframes pop { from { transform:scale(.2) rotate(-14deg); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes beat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.09); } }
  @keyframes halo { from { transform:scale(.8); opacity:.8; } to { transform:scale(2.6); opacity:0; } }
  @keyframes splashOut { to { opacity:0; visibility:hidden; transform:scale(1.04); } }
  @keyframes riseIn { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .rise { opacity:0; }
  body.ready .rise { animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 55ms); }
  body.ready #app.still .rise { animation:none; opacity:1; }
  @media (prefers-reduced-motion: reduce) { #splash { display:none; } .rise { opacity:1; } body.ready .rise { animation:none; } * { transition-duration:.01ms !important; scroll-behavior:auto !important; } }

  /* calorie ring */
  .ringcard { display:flex; align-items:center; gap:16px; }
  .ringbox { position:relative; width:124px; height:124px; flex:none; }
  .ring { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:11; stroke-linecap:round; }
  .ring .bg { stroke:var(--line); }
  .ring .fg { stroke:url(#rg); stroke-dasharray:327; stroke-dashoffset:calc(327 - 327 * var(--p) / 100); animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .ring .fg.over { stroke:#d6334f; }
  @keyframes ringIn { from { stroke-dashoffset:327; } }
  .ringlabel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .ringlabel b { font-size:26px; letter-spacing:-1px; }
  .macros { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .macro { background:var(--soft); border-radius:999px; padding:3px 9px; font-size:12px; font-weight:700; }

  /* carousels (celebrities, training styles) */
  .carousel { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x proximity; scroll-padding-inline:16px; padding:4px 2px 10px; -webkit-overflow-scrolling:touch; margin:0 -16px; padding-inline:16px; scrollbar-width:none; }
  .carousel::-webkit-scrollbar { display:none; }
  .cc { flex:0 0 96px; scroll-snap-align:start; background:none; border:0; padding:0; color:var(--ink); display:flex; box-shadow:none;
        flex-direction:column; align-items:center; gap:6px; width:96px; font-weight:400; }
  .ph { width:84px; height:84px; border-radius:50%; background:var(--line); overflow:hidden; display:flex; align-items:center;
        justify-content:center; font-weight:700; color:var(--pink); font-size:24px; border:3px solid transparent; transition:transform .2s, border-color .2s; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc.on .ph { border-color:var(--pink); box-shadow:0 0 0 3px var(--card) inset; transform:scale(1.06); }
  .cc.on .cn { color:var(--pink); font-weight:800; }
  .cn { font-size:13px; line-height:1.2; text-align:center; } .cd { font-size:11px; color:var(--mute); line-height:1.2; text-align:center; }
  .rowbtn { background:none; color:var(--ink); border-radius:0; width:100%; text-align:left; font-weight:400; font-size:16px; padding:10px 0; box-shadow:none;
            display:flex; justify-content:space-between; align-items:center; }
  .chip { background:var(--card); color:var(--ink); border:1.5px solid var(--line); text-align:left; font-weight:400; margin-bottom:8px; font-size:14px; box-shadow:none; }
  .chip.on { border-color:var(--pink); background:var(--soft); }

  /* coach tab */
  .hero { position:relative; overflow:hidden; color:#fff; border:0; background:var(--grad); padding:20px 18px; }
  .hero::after { content:""; position:absolute; right:-40px; top:-40px; width:170px; height:170px; border-radius:50%; background:rgba(255,255,255,.14); }
  .hero .avatar { width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; flex:none; }
  .hero .who { display:flex; align-items:center; gap:14px; position:relative; z-index:1; }
  .hero h1 { margin:0; font-size:26px; } .hero .sub { opacity:.92; font-size:14px; } .hero .pill { display:inline-block; margin-top:10px; background:rgba(255,255,255,.22); border-radius:999px; padding:4px 11px; font-size:12px; font-weight:700; position:relative; z-index:1; }
  .progress { position:relative; overflow:hidden; }
  .progress .head { display:flex; justify-content:space-between; align-items:baseline; }
  .dots { display:flex; gap:6px; margin-top:10px; }
  .dots span { flex:1; height:9px; border-radius:6px; background:var(--line); transition:background .4s, transform .4s; }
  .dots span.on { background:var(--grad); transform:scaleY(1.25); }
  .tcard { flex:0 0 190px; scroll-snap-align:start; text-align:left; background:var(--card); color:var(--ink); border:1.5px solid var(--line); border-radius:18px;
           padding:13px; font-weight:400; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:5px; }
  .tcard b { font-size:15px; letter-spacing:-.2px; } .tcard .mute { font-size:12px; }
  .tcard.on { border-color:var(--pink); background:var(--soft); box-shadow:0 0 0 2px rgba(232,69,124,.25), var(--shadow); }
  .badge { display:inline-block; align-self:flex-start; font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; background:var(--info); border:1px solid var(--info-line); }
  .dcard { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden; transition:border-color .25s, box-shadow .25s; }
  .dcard.today { border-color:var(--pink); box-shadow:0 0 0 2px rgba(232,69,124,.22), var(--shadow); }
  .dcard.done { background:linear-gradient(180deg,var(--good),var(--card) 70%); border-color:var(--good-line); }
  .dhead { display:flex; align-items:center; gap:12px; padding:14px; }
  .dtoggle { flex:1; display:flex; align-items:center; gap:12px; text-align:left; background:none; color:var(--ink); box-shadow:none; padding:0; border-radius:0; font-weight:400; }
  .dbadge { width:46px; flex:none; text-align:center; border-radius:14px; padding:6px 0; background:var(--soft); line-height:1.1; }
  .dbadge b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--pink); } .dbadge span { font-size:20px; font-weight:800; }
  .dcard.today .dbadge { background:var(--grad); } .dcard.today .dbadge b, .dcard.today .dbadge span { color:#fff; }
  .dtitle { font-weight:800; font-size:16px; letter-spacing:-.2px; } .dmeta { font-size:12.5px; color:var(--mute); }
  .chk { width:44px; height:44px; flex:none; padding:0; border-radius:50%; background:var(--card); color:#fff; border:2.5px solid var(--line); box-shadow:none; display:flex; align-items:center; justify-content:center; }
  .chk svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:26; stroke-dashoffset:26; transition:stroke-dashoffset .35s ease .05s; }
  .chk[aria-checked="true"] { background:var(--grad); border-color:transparent; } .chk[aria-checked="true"] svg { stroke-dashoffset:0; }
  .chk.just { animation:checkpop .5s cubic-bezier(.2,1.7,.4,1); }
  @keyframes checkpop { 0% { transform:scale(.8); } 55% { transform:scale(1.22); } 100% { transform:scale(1); } }
  .dbody { display:none; padding:0 14px 14px; } .dcard.open .dbody { display:block; animation:rise .35s ease both; }
  .dbody h4 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--mute); }
  .ex { padding:10px 0; border-top:1px solid var(--line); } .ex:first-of-type { border-top:0; }
  .ex-top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; } .ex-top b { font-size:15px; min-width:0; }
  .ex-do { flex:none; font-weight:800; font-size:15px; color:var(--pink); text-align:right; }
  .ex .mute { margin-top:2px; } .ex-rest { margin-top:3px; font-size:12px; font-weight:700; color:var(--mute); }
  .track { margin-top:12px; background:var(--soft); border-radius:12px; padding:10px 12px; font-size:13.5px; }
  .opt { font-size:11px; font-weight:700; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
  .confetti { position:absolute; left:50%; top:40%; width:9px; height:14px; border-radius:2px; pointer-events:none; animation:burst 1.2s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes burst { to { transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }

  /* modals */
  .modal { position:fixed; inset:0; background:rgba(21,14,24,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:fade .25s ease both;
           -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .sheet { position:relative; background:var(--bg); color:var(--ink); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
           border-radius:26px 26px 0 0; padding:22px 18px calc(26px + env(safe-area-inset-bottom)); animation:sheetUp .38s cubic-bezier(.2,.9,.2,1) both; }
  @keyframes fade { from { opacity:0; } } @keyframes sheetUp { from { transform:translateY(60px); opacity:0; } }
  .sheet .x { position:sticky; top:0; float:right; width:36px; height:36px; padding:0; border-radius:50%; background:var(--card); color:var(--ink);
              border:1px solid var(--line); font-size:16px; z-index:1; box-shadow:none; }
  .sheet h2 { font-size:22px; margin:0 0 4px; letter-spacing:-.4px; } .sheet h3 { font-size:15px; margin:18px 0 4px; }
  .sheet ul, .sheet ol { margin:4px 0; padding-left:20px; } .sheet li { margin:3px 0; }
  .steps li { margin:9px 0; } .grp { font-weight:700; margin-top:8px; font-size:14px; } .small-print { font-size:12px; margin-top:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip2 { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:13px; }
  .f-watch { background:var(--warn); border-color:var(--warn-line); } .f-good { background:var(--good); border-color:var(--good-line); } .f-info { background:var(--info); border-color:var(--info-line); }
  .verdict { border-radius:16px; padding:11px 13px; margin:10px 0; } .verdict b { display:block; font-size:15px; }
  .v-good { background:var(--good); border:1px solid var(--good-line); } .v-okay { background:var(--warn); border:1px solid var(--warn-line); } .v-limit { background:var(--bad); border:1px solid var(--bad-line); }
  .tag { font-size:11px; border-radius:6px; padding:1px 6px; margin-left:4px; } .t-usda { background:var(--good); } .t-est { background:var(--warn); }
  .items .meal { padding:7px 0; }

  /* ===== wider screens: phone layout above stays as is; tablets get two columns; desktops get a sidebar ===== */
  .duo, .cols { display:block; }
  @media (min-width:700px) {
    .shell { max-width:760px; padding-inline:28px; }
    nav { max-width:760px; }
    h1 { font-size:32px; }
    .duo { display:grid; grid-template-columns:1.1fr 1fr; gap:18px; align-items:stretch; margin-bottom:14px; }
    .duo .card { margin-bottom:0; } .duo .card:last-child { display:flex; align-items:center; font-size:17px; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
    .cols > section > h2:first-child { margin-top:0; }
    #app[data-tab=plan], #app[data-tab=coach], #app[data-tab=me] { display:grid; column-gap:20px; align-items:start; }
    #app[data-tab=plan], #app[data-tab=coach] { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    #app[data-tab=plan] > h1, #app[data-tab=plan] > p, #app[data-tab=coach] > h2, #app[data-tab=coach] > p,
    #app[data-tab=coach] > .carousel, #app[data-tab=coach] > .full, #app[data-tab=me] > h1, #app[data-tab=me] > p { grid-column:1 / -1; }
    #app[data-tab=coach] > .hero, #app[data-tab=coach] > .progress { align-self:stretch; }
    #styles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; overflow:visible; margin:0; padding:4px 2px 10px; }
    #app[data-tab=me] { grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); }
    .pickcol { grid-column:1; grid-row:3 / span 2; } .formcol { grid-column:2; }
    .pickcol .carousel { flex-wrap:wrap; overflow:visible; margin:0; padding:4px 2px 10px; scroll-padding:0; gap:14px 10px; }
    .modal { align-items:center; padding:24px; }
    .sheet { border-radius:26px; max-height:88vh; max-width:680px; animation:dialogIn .3s cubic-bezier(.2,.9,.2,1) both; }
    @keyframes dialogIn { from { transform:translateY(14px) scale(.97); opacity:0; } }
  }
  @media (min-width:960px) {
    .shell { max-width:1160px; padding:0 36px 64px; display:grid; grid-template-columns:232px minmax(0, 1fr); column-gap:40px; align-items:start; }
    .top { grid-column:1 / -1; padding-top:26px; padding-bottom:18px; font-size:19px; } .top svg { width:34px; height:34px; }
    nav { position:sticky; top:24px; bottom:auto; left:auto; right:auto; grid-column:1; flex-direction:column; gap:6px; max-width:none; margin:0; padding:12px;
          border:1px solid var(--line); border-radius:22px; background:var(--card); box-shadow:var(--shadow); -webkit-backdrop-filter:none; backdrop-filter:none; }
    nav button { flex:none; flex-direction:row; justify-content:flex-start; gap:12px; font-size:15px; padding:13px 14px; border-radius:14px; }
    nav button svg { width:22px; height:22px; } nav button.on svg { transform:none; }
    #app { grid-column:2; min-width:0; }
    h1 { font-size:36px; }
    .hero h1 { font-size:30px; }
    .sheet { max-width:720px; }
  }
  @media (hover:hover) {
    button:hover, .btn:hover { filter:brightness(1.06); }
    button.ghost:hover, nav button:hover:not(.on), .rowbtn:hover { background:var(--soft); filter:none; }
    nav button:hover:not(.on) { color:var(--ink); }
    .rowbtn { border-radius:12px; padding-inline:8px; margin-inline:-8px; width:calc(100% + 16px); }
    .tcard { transition:transform .15s, border-color .2s, box-shadow .2s; } .tcard:hover { border-color:var(--pink2); transform:translateY(-2px); filter:none; }
    .cc:hover, .dtoggle:hover, .chk:hover, .chip:hover { filter:none; } .cc:hover .ph { transform:scale(1.07); }
    .dtoggle:hover .dtitle { color:var(--pink); } .chk:hover { border-color:var(--pink2); } .chip:hover { border-color:var(--pink2); }
  }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="inner">
    <span class="halo"></span>
    <svg class="mark" viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="rgba(255,255,255,.2)"/><path d="M60 92 C21 63 27 33 46 33 C54 33 58 39 60 43 C62 39 66 33 74 33 C93 33 99 63 60 92Z" fill="#fff"/></svg>
    <div class="word">Muse Coach</div>
    <div class="tag">Train. Eat. Glow.</div>
  </div>
</div>
<a class="skip" href="#app">Skip to content</a>
<div class="shell">
<header class="top"><svg viewBox="0 0 120 120"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#c93472"/></linearGradient></defs><rect width="120" height="120" rx="28" fill="url(#lg)"/><path d="M60 90 C22 62 28 34 46 34 C54 34 58 40 60 44 C62 40 66 34 74 34 C92 34 98 62 60 90Z" fill="#fff"/></svg><span class="grad-text">Muse Coach</span></header>
<nav aria-label="Main">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Coach</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Meals</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Me</button>
</nav>
<main id="app" tabindex="-1"></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
let state = null, tab = "today", celebs = [], busy = "", editing = null, animateNext = true;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || "Something went wrong.");
  return body;
}
const json = (method, data) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
// The server and storage stay metric; the screen is US units (ft/in, lb, calories).
const LB_PER_KG = 2.2046226, CM_PER_IN = 2.54;
const kgToLb = kg => Math.round(kg * LB_PER_KG * 10) / 10;
const lbToKg = lb => Math.round(lb / LB_PER_KG * 100) / 100; // 2 decimals so lb round-trips without drift
const cmToFtIn = cm => { const t = Math.round(cm / CM_PER_IN); return { ft: Math.floor(t / 12), inch: t % 12 }; };
const ftInToCm = (ft, inch) => Math.round((ft * 12 + inch) * CM_PER_IN * 100) / 100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  let opts;
  [state, opts] = await Promise.all([api("/api/state"), api("/api/options")]);
  celebs = opts.celebrities; styles = opts.styles;
  render();
}

// Every full-screen render ends here: stagger the entrance animation (only on tab changes, not on small in-place updates).
function finishRender() {
  app.classList.toggle("still", !animateNext);
  animateNext = false;
  app.querySelectorAll(".rise").forEach((el, i) => el.style.setProperty("--i", Math.min(i, 12)));
}

function render() {
  app.dataset.tab = state.profile ? tab : "me";
  document.querySelectorAll("nav button").forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle("on", on); on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"); });
  if (!state.profile) { app.innerHTML = setupHtml(); wireSetup(); finishRender(); return; }
  ({ today: renderToday, coach: renderCoach, plan: renderPlan, me: () => { app.innerHTML = setupHtml(state.profile); wireSetup(); finishRender(); } })[tab]();
}

function renderToday() {
  const { plan, eaten_kcal, remaining_kcal, meals, message } = state;
  const pct = Math.min(100, Math.round(eaten_kcal / plan.target_kcal * 100)), over = eaten_kcal > plan.target_kcal;
  const t = state.training, td = t.days.find(d => d.day === t.today);
  app.innerHTML = `
    <h1 class="rise">Today <span class="mute" style="font-weight:600;letter-spacing:0">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</span></h1>
    <div class="duo">
    <div class="card ringcard rise">
      <div class="ringbox">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${eaten_kcal} of ${plan.target_kcal} calories">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#c93472"/></linearGradient></defs>
          <circle class="bg" cx="60" cy="60" r="52"/><circle class="fg ${over ? "over" : ""}" cx="60" cy="60" r="52" style="--p:${pct}"/>
        </svg>
        <div class="ringlabel"><b>${eaten_kcal}</b><span class="mute">of ${plan.target_kcal} cal</span></div>
      </div>
      <div>
        <div style="font-weight:800;font-size:18px">${remaining_kcal >= 0 ? remaining_kcal + " left" : -remaining_kcal + " over"}</div>
        <div class="macros"><span class="macro">P ${plan.protein_g}g</span><span class="macro">C ${plan.carbs_g}g</span><span class="macro">F ${plan.fat_g}g</span></div>
      </div>
    </div>
    <div class="card rise"><div>${esc(message)}</div></div>
    </div>
    ${td.kind === "workout" ? `<button type="button" class="rise" id="gocoach" style="text-align:left;margin-bottom:14px"><span style="opacity:.85;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Today's workout${td.done ? " · done ✓" : ""}</span><br>${esc(td.title)} · ${td.minutes} min</button>` : ""}
    <div class="cols"><section>
    <label class="btn rise" for="photo">${busy || "📷 Log a meal with a photo"}</label>
    <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
    <div id="err"></div>
    <h2 class="rise">Add by hand</h2>
    <div class="row rise"><input id="mname" placeholder="Meal"><input id="mkcal" type="number" inputmode="numeric" placeholder="Calories"></div>
    <button class="ghost rise" id="addbtn" style="margin-top:8px">Add</button>
    </section><section>
    <h2 class="rise">Logged today</h2>
    <div class="card rise">${meals.length ? meals.map(m => editing === m.id ? `
      <div class="meal" style="display:block"><div class="row"><input id="ename" value="${esc(m.name)}" maxlength="80">
      <input id="ekcal" type="number" inputmode="numeric" value="${m.kcal}"></div>
      <div class="row" style="margin-top:8px"><button class="small" id="esave">Save</button><button class="small ghost" id="ecancel">Cancel</button></div></div>` : `
      <div class="meal"><div>${esc(m.name)}<div class="mute">${m.source === "photo" ? (m.analysis ? "AI analysis (approximate)" : "photo estimate (approximate)") : "manual"}</div></div>
      <div>${m.kcal} ${m.analysis ? `<button class="small ghost" data-info="${m.id}" aria-label="Details">ⓘ</button>` : ""}<button class="small ghost" data-edit="${m.id}" aria-label="Edit">✎</button> <button class="small ghost" data-del="${m.id}" aria-label="Delete">✕</button></div></div>`).join("") : '<span class="mute">Nothing yet. Snap your first meal.</span>'}</div>
    </section></div>`;
  const go = $("#gocoach"); if (go) go.onclick = () => { tab = "coach"; animateNext = true; render(); window.scrollTo({ top: 0 }); };
  $("#photo").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    busy = "Estimating…"; renderToday();
    const fd = new FormData(); fd.append("photo", f);
    try {
      const r = await api("/api/meals/photo", { method: "POST", body: fd });
      state = r; busy = ""; renderToday();
      const est = r.estimate;
      if (est.demo) showErr("Demo estimate: set ANTHROPIC_API_KEY on the server for real photo estimates.");
      else if (est.method === "ai-rag") openModal(analysisHtml(est, true));
      else if (est.method === "on-device") showNote(`Looks like ${est.meal_name.toLowerCase()}. This is about one typical serving (${est.serving}), worked out on your device. If your portion was different, tap ✎ to adjust.`);
      else if (est.confidence === "low") showErr("Low confidence estimate. Tap ✎ to fix it if it looks off.");
    } catch (err) { busy = ""; renderToday(); showErr(err.message); }
  };
  document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => openModal(analysisHtml(state.meals.find(m => m.id === +b.dataset.info).analysis, false)));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = +b.dataset.edit; renderToday(); });
  if ($("#esave")) {
    $("#ecancel").onclick = () => { editing = null; renderToday(); };
    $("#esave").onclick = async () => {
      const name = $("#ename").value.trim(), kcal = parseInt($("#ekcal").value, 10);
      if (!name || isNaN(kcal)) return showErr("Enter a meal name and calories.");
      try { state = await api("/api/meals/" + editing, json("PATCH", { name, kcal })); editing = null; renderToday(); } catch (err) { showErr(err.message); }
    };
  }
  $("#addbtn").onclick = async () => {
    const name = $("#mname").value.trim(), kcal = parseInt($("#mkcal").value, 10);
    if (!name || isNaN(kcal)) return showErr("Enter a meal name and calories.");
    try { state = await api("/api/meals", json("POST", { name, kcal })); renderToday(); } catch (err) { showErr(err.message); }
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    state = await api("/api/meals/" + b.dataset.del, { method: "DELETE" }); renderToday();
  });
  finishRender();
}
function showErr(msg) { const e = $("#err"); if (e) e.innerHTML = `<div class="err">${esc(msg)}</div>`; }
function showNote(msg) { const e = $("#err"); if (e) e.innerHTML = `<div class="note">${esc(msg)}</div>`; }
// The web edition reports model download / analysis progress while a photo is being processed.
window.addEventListener("muse-status", e => {
  if (!busy) return;
  busy = e.detail;
  const l = document.querySelector("label.btn"); if (l) l.textContent = busy;
});

// ---- coach tab: training style, a specific week of workouts, and check-offs ----
let openDay = null, justChecked = null;
const EQUIP = { none: "No equipment" };
const CHECK_SVG = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function dayCard(d, today) {
  const dateNum = new Date(d.date + "T00:00:00").getDate(), isOpen = openDay === d.day;
  return `<article class="dcard rise ${d.done ? "done" : ""} ${d.day === today ? "today" : ""} ${isOpen ? "open" : ""}" data-card="${d.day}">
    <div class="dhead">
      <button type="button" class="dtoggle" data-toggle="${d.day}" aria-expanded="${isOpen}">
        <span class="dbadge"><b>${d.day}</b><span>${dateNum}</span></span>
        <span><span class="dtitle">${esc(d.title)}</span>${d.kind === "recovery" ? '<span class="opt">optional</span>' : ""}<br>
        <span class="dmeta">${esc(d.focus)} · ${d.minutes} min${d.day === today ? " · today" : ""}</span></span>
      </button>
      <button type="button" class="chk ${justChecked === d.day ? "just" : ""}" role="checkbox" aria-checked="${d.done}" data-check="${d.day}" aria-label="Mark ${esc(d.title)} on ${d.day} as done">${CHECK_SVG}</button>
    </div>
    <div class="dbody">
      <h4>Warm-up</h4><div>${esc(d.warmup)}</div>
      <h4>Workout</h4>
      ${d.exercises.map(e => `<div class="ex"><div class="ex-top"><b>${esc(e.n)}</b><span class="ex-do">${esc(e.do)}</span></div><div class="mute">${esc(e.cue)}</div><div class="ex-rest">Rest: ${esc(e.rest)}</div></div>`).join("")}
      <h4>Cool-down</h4><div>${esc(d.cooldown)}</div>
      <div class="track"><b>Track:</b> ${esc(d.metric)}</div>
    </div>
  </article>`;
}

function renderCoach() {
  const c = state.coach, p = state.plan, t = state.training;
  if (openDay === null || !t.days.some(d => d.day === openDay)) openDay = t.today;
  const workouts = t.days.filter(d => d.kind === "workout");
  app.innerHTML = `
    <div class="card hero rise">
      <div class="who"><div class="avatar">${esc(c.coach.replace("Coach ", "")[0])}</div>
        <div><h1>${esc(c.coach)}</h1><div class="sub">${esc(c.tagline)}</div></div></div>
      ${state.profile.celebrity ? `<span class="pill">Style target: ${esc(state.profile.celebrity)}</span>` : ""}
    </div>

    <div class="card progress rise" id="progress">
      <div class="head"><b>This week</b><span class="mute"><b style="color:var(--pink);font-size:15px">${t.done_workouts}</b> of ${t.planned} workouts done</span></div>
      <div class="dots">${workouts.map(d => `<span class="${d.done ? "on" : ""}" title="${d.day}"></span>`).join("")}</div>
      <div class="mute" style="margin-top:8px">${t.all_done ? "Week complete! Great work. 🎉" : "Tick each day when you finish. Optional recovery days are there to keep you moving."}</div>
    </div>

    <h2 class="rise">Training style</h2>
    <div class="carousel rise" id="styles">${t.styles.map(s => `<button type="button" class="tcard ${s.key === t.style ? "on" : ""}" data-style="${s.key}" aria-pressed="${s.key === t.style}">
      <b>${esc(s.name)}</b><span class="mute">${esc(s.tagline)}</span><span class="badge">${esc(EQUIP[s.equipment] || s.equipment)}</span></button>`).join("")}</div>
    <div class="card rise full"><b>${esc(t.style_name)}</b>
      <div class="mute" style="margin-top:4px">${esc(t.equipment_note)}</div>
      <div style="margin-top:8px"><b>How to progress:</b> ${esc(t.progression)}</div></div>

    <h2 class="rise">Your week</h2>
    ${t.days.map(d => dayCard(d, t.today)).join("")}

    <h2 class="rise">Your plan</h2>
    <div class="card rise full">${p.target_kcal} calories a day (maintenance ${p.maintenance_kcal}).
      ${p.weekly_change_kg ? `Expected change: ${p.weekly_change_kg > 0 ? "+" : ""}${kgToLb(p.weekly_change_kg)} lb/week${p.weeks_to_goal ? ", about " + p.weeks_to_goal + " weeks to " + Math.round(kgToLb(p.goal_weight_kg)) + " lb" : ""}.` : "Holding steady."}
      ${p.notes.map(n => `<div class="note">${esc(n)}</div>`).join("")}</div>
    <h2 class="rise">Tips from ${esc(c.coach)}</h2><div class="card rise full">${c.tips.map(x => `<div class="meal">${esc(x)}</div>`).join("")}</div>
    <p class="mute rise">The celebrity you pick only chooses your coach. Your targets come from your own body and are kept within healthy limits. ${esc(t.safety)}</p>`;

  const chosen = $("#styles .tcard.on"); // bring the selected style into view
  if (chosen) $("#styles").scrollTo({ left: Math.max(0, chosen.offsetLeft - 16), behavior: "instant" });
  document.querySelectorAll("[data-style]").forEach(b => b.onclick = async () => {
    if (b.dataset.style === t.style) return;
    try { state = await api("/api/training", json("PUT", { style: b.dataset.style })); const y = window.scrollY; renderCoach(); window.scrollTo(0, y); } catch (err) { alert(err.message); }
  });
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const day = b.dataset.toggle; openDay = openDay === day ? "" : day;
    document.querySelectorAll(".dcard").forEach(card => { const open = card.dataset.card === openDay; card.classList.toggle("open", open); card.querySelector(".dtoggle").setAttribute("aria-expanded", open); });
  });
  document.querySelectorAll("[data-check]").forEach(b => b.onclick = async () => {
    const day = b.dataset.check, want = b.getAttribute("aria-checked") !== "true", wasAllDone = state.training.all_done;
    try {
      state = await api("/api/workouts/check", json("POST", { day, done: want }));
      justChecked = want ? day : null; if (navigator.vibrate) navigator.vibrate(want ? 18 : 0);
      const y = window.scrollY; renderCoach(); window.scrollTo(0, y);
      if (!wasAllDone && state.training.all_done) burst();
    } catch (err) { alert(err.message); }
  });
  finishRender();
}

function burst() {
  const host = $("#progress"); if (!host || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#e8457c", "#ff7aa8", "#ffc857", "#7bd88f", "#8ab4ff"];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 120;
    s.className = "confetti"; s.style.background = colors[i % colors.length];
    s.style.setProperty("--dx", Math.cos(a) * r + "px"); s.style.setProperty("--dy", Math.sin(a) * r - 30 + "px"); s.style.setProperty("--rot", Math.random() * 720 - 360 + "deg");
    host.appendChild(s); setTimeout(() => s.remove(), 1300);
  }
}

async function renderPlan() {
  app.innerHTML = "<h1>Meals</h1><p class='mute'>Loading…</p>";
  const { week, target_kcal } = await api("/api/mealplan");
  app.innerHTML = `<h1 class="rise">Meals</h1><p class="mute rise">Recipes with portions scaled to your ${target_kcal} calories. Tap one for the ingredients and cooking steps.</p>` +
    week.map(d => `<div class="card rise"><div class="day">${d.day}</div>${d.meals.map(m => `
      <button type="button" class="meal rowbtn" data-recipe="${esc(m.recipe_id)}" data-serv="${m.servings}"><div><span class="mute">${m.slot}</span><br><b>${esc(m.name)}</b>
      <div class="mute">${m.servings}× serving</div></div><div>${m.kcal} <span class="mute">›</span></div></button>`).join("")}
      <div class="mute" style="margin-top:6px">Snacks: ~${d.snack_budget} calories</div></div>`).join("");
  document.querySelectorAll("[data-recipe]").forEach(b => b.onclick = async () => {
    try { openRecipe(await api("/api/recipes/" + b.dataset.recipe), +b.dataset.serv); } catch (err) { openModal(`<h2>Couldn't open recipe</h2><p>${esc(err.message)}</p>`); }
  });
  finishRender();
}

// ---- modals (stackable: the cooking steps open in their own modal on top of the ingredients) ----
function openModal(html) {
  const m = document.createElement("div");
  m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
  m.innerHTML = `<div class="sheet"><button type="button" class="x" aria-label="Close">✕</button>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); });
  m.querySelector(".x").onclick = closeModal;
  document.body.appendChild(m); document.body.style.overflow = "hidden";
  m.querySelector(".x").focus();
  return m;
}
function closeModal() {
  const all = document.querySelectorAll(".modal"); if (all.length) all[all.length - 1].remove();
  if (!document.querySelector(".modal")) document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const li = items => `<ul>${items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
const g1 = n => (n == null ? "–" : Math.round(n * 10) / 10);

function openRecipe(r, serv) {
  const n = r.nutrition, a = r.source;
  const attribution = `<p class="mute small-print">Recipe text adapted from <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
    (<a href="${esc(a.history)}" target="_blank" rel="noopener">authors</a>), licensed <a href="${esc(a.license_url)}" target="_blank" rel="noopener">${esc(a.license)}</a>.
    Nutrition is calculated from USDA FoodData Central.</p>`;
  const stepsHtml = `<h2>Cooking steps</h2><div class="mute">${esc(r.name)}</div>
    <ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${r.notes.length ? `<h3>Tips and variations</h3>${li(r.notes)}` : ""}${attribution}`;
  const html = `<h2>${esc(r.name)}</h2>
    <div class="mute">Makes ${esc(r.servings_note)}${serv && serv !== 1 ? ` · your plan uses ${serv}× a serving` : ""}</div>
    <div class="chips"><span class="chip2"><b>${n.kcal}</b> cal</span><span class="chip2"><b>${g1(n.protein)}</b> g protein</span><span class="chip2"><b>${g1(n.carb)}</b> g carbs</span>
      <span class="chip2"><b>${g1(n.fat)}</b> g fat</span><span class="chip2"><b>${g1(n.sodium)}</b> mg sodium</span></div>
    <div class="mute">per serving</div>
    <h3>Ingredients</h3>
    ${r.ingredients.map(g => `${g.heading ? `<div class="grp">${esc(g.heading)}</div>` : ""}${li(g.items)}`).join("")}
    ${r.assumptions ? `<div class="note">${esc(r.assumptions)}</div>` : ""}
    <button type="button" data-open-steps style="margin-top:12px">Cooking instructions</button>
    ${attribution}`;
  const m = openModal(html);
  m.querySelector("[data-open-steps]").onclick = () => openModal(stepsHtml); // its own modal, on top of the ingredients
}

const VERDICT = { good: ["Good choice", "v-good"], okay: ["Fine in moderation", "v-okay"], limit: ["Better as an occasional treat", "v-limit"] };
function analysisHtml(a, fresh) {
  const [label, cls] = VERDICT[a.insight.verdict.rating] || VERDICT.okay, t = a.totals, v = a.insight.verdict;
  const src = s => s.type === "usda" ? `<span class="tag t-usda">USDA</span>` : s.type === "estimate" ? `<span class="tag t-est">AI estimate</span>` : `<span class="tag t-est">no data</span>`;
  return `<h2>${esc(a.meal_name)}</h2>
    ${fresh ? `<div class="mute">Logged to today. Tap ✎ on the list to adjust if your portion was different.</div>` : ""}
    <div class="verdict ${cls}"><b>${label}</b><div>${esc(v.headline)}</div></div>
    ${v.why ? `<p>${esc(v.why)}</p>` : ""}${v.fits_goal ? `<p class="mute">${esc(v.fits_goal)}</p>` : ""}
    <div class="big">${a.total_kcal} <span class="mute">calories · likely ${a.kcal_range[0]}–${a.kcal_range[1]}</span></div>
    <div class="mute">Protein ${g1(t.protein)} g · Carbs ${g1(t.carb)} g · Fat ${g1(t.fat)} g · Fiber ${g1(t.fiber)} g · Sugars ${g1(t.sugar)} g · Sodium ${g1(t.sodium)} mg</div>
    ${a.flags.length ? `<div class="chips">${a.flags.map(f => `<span class="chip2 f-${f.level}" title="${esc(f.detail)}">${esc(f.label)}</span>`).join("")}</div>
      <ul class="mute">${a.flags.map(f => `<li>${esc(f.label)}: ${esc(f.detail)}</li>`).join("")}</ul>` : ""}
    <h3>What I found</h3>
    <div class="items">${a.items.map(i => `<div class="meal"><div>${esc(i.name)}<div class="mute">about ${i.grams} g ${src(i.source)}</div></div><div>${i.kcal ?? "?"}</div></div>`).join("")}</div>
    ${a.insight.contents.length ? `<h3>What's in it</h3>${li(a.insight.contents)}` : ""}
    ${a.insight.benefits.length ? `<h3>Good to know</h3>${li(a.insight.benefits)}` : ""}
    ${a.insight.concerns.length ? `<h3>Worth watching</h3>${li(a.insight.concerns)}` : ""}
    ${a.insight.tips.length ? `<h3>Tips</h3>${li(a.insight.tips)}` : ""}
    <p class="mute small-print">Numbers come from ${esc(a.sources)}; the AI identified the food and estimated the amount from the photo, so treat totals as approximate.
    ${a.grounded_share < 1 ? "Items marked “AI estimate” had no database match. " : ""}General information, not medical advice.</p>`;
}

// ---- celebrity picker: carousel of Wikipedia portraits + name search ----
let styles = [], pick = { name: "", style: "" }, extraCelebs = [], photos = {};
const isListed = name => celebs.some(c => c.name === name);
const safeThumb = u => (typeof u === "string" && /^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u)) ? u : "";
const PERSON = /born \d{4}|actor|actress|singer|model|rapper|dancer|athlete|player|presenter|personality|musician|wrestler|boxer|idol|comedian|influencer|businesswoman|businessman/i;
const WIKI = "https://en.wikipedia.org/w/api.php?";

async function wikiThumbs(titles) {
  const need = titles.filter(t => !(t in photos));
  if (!need.length) return;
  try {
    const r = await fetch(WIKI + new URLSearchParams({ action: "query", titles: need.join("|"), prop: "pageimages", piprop: "thumbnail",
      pithumbsize: "240", redirects: "1", format: "json", origin: "*" }));
    const q = (await r.json()).query || {};
    const hop = {}; // requested title -> final page title (Wikipedia normalizes and redirects)
    [...(q.normalized || []), ...(q.redirects || [])].forEach(m => { hop[m.from] = m.to; });
    const byTitle = {}; Object.values(q.pages || {}).forEach(pg => { byTitle[pg.title] = safeThumb(pg.thumbnail && pg.thumbnail.source); });
    need.forEach(t => { let f = t, n = 0; while (hop[f] && n++ < 4) f = hop[f]; photos[t] = byTitle[f] || ""; });
  } catch { need.forEach(t => { photos[t] = ""; }); } // offline: initials fall back
}

async function wikiSearch(name) {
  const r = await fetch(WIKI + new URLSearchParams({ action: "query", generator: "search", gsrsearch: name, gsrlimit: "10", prop: "pageimages|description",
    piprop: "thumbnail", pithumbsize: "240", format: "json", origin: "*" }));
  const pages = Object.values(((await r.json()).query || {}).pages || {}).sort((a, b) => a.index - b.index);
  return pages.filter(pg => safeThumb(pg.thumbnail && pg.thumbnail.source) && PERSON.test(pg.description || "")).slice(0, 5)
    .map(pg => ({ name: pg.title, wiki: pg.title, desc: pg.description || "", thumb: safeThumb(pg.thumbnail.source) }));
}

const initials = n => esc(n.replace(/\(.*\)/, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase());
function cardHtml(c, i, on) {
  const img = photos[c.wiki] || c.thumb;
  return `<button type="button" class="cc ${on ? "on" : ""}" data-i="${i}"><span class="ph">${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : initials(c.name)}</span>
    <span class="cn">${esc(c.name)}</span>${c.desc ? `<span class="cd">${esc(c.desc)}</span>` : ""}</button>`;
}

function renderCarousel() {
  const el = $("#carousel"); if (!el) return;
  const all = [...extraCelebs, ...celebs];
  el.innerHTML = all.map((c, i) => cardHtml(c, i, c.name === pick.name)).join("");
  el.querySelectorAll(".cc").forEach(b => b.onclick = () => { pick.name = all[+b.dataset.i].name; renderCarousel(); renderStyleBox(); });
  const on = el.querySelector(".cc.on"); if (on) el.scrollTo({ left: on.offsetLeft - 16, behavior: "smooth" });
  renderStyleBox();
}

function renderStyleBox() {
  const el = $("#stylebox"); if (!el) return;
  if (!pick.name || isListed(pick.name)) { el.innerHTML = ""; return; }
  const cur = pick.style || "athletic";
  el.innerHTML = `<label>Which coach style fits ${esc(pick.name)}?</label>` + styles.map(s =>
    `<button type="button" class="chip ${s.key === cur ? "on" : ""}" data-s="${s.key}"><b>${esc(s.coach)}</b><br><span class="mute">${esc(s.tagline)}</span></button>`).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { pick.style = b.dataset.s; renderStyleBox(); });
}

async function findCelebrity() {
  const name = $("#csearch").value.trim(), out = $("#cresults"); if (!name) return;
  out.innerHTML = '<p class="mute">Searching…</p>';
  let hits = [];
  try { hits = await wikiSearch(name); } catch { out.innerHTML = '<div class="err">Couldn\'t search right now. Check your connection.</div>'; return; }
  if (!hits.length) {
    out.innerHTML = `<p class="mute">No photo found for "${esc(name)}". Try the full name, or use it without a photo.</p>
      <button type="button" class="ghost" id="usename">Use "${esc(name)}" anyway</button>`;
    $("#usename").onclick = () => { addCeleb({ name, wiki: name, thumb: "" }); out.innerHTML = ""; };
    return;
  }
  out.innerHTML = `<p class="mute">Tap the right one:</p><div class="carousel" id="hits">${hits.map((c, i) => cardHtml(c, i, false)).join("")}</div>`;
  out.querySelectorAll(".cc").forEach(b => b.onclick = () => { addCeleb(hits[+b.dataset.i]); out.innerHTML = ""; $("#csearch").value = ""; });
}
function addCeleb(c) {
  if (c.thumb) photos[c.wiki] = c.thumb;
  if (!isListed(c.name) && !extraCelebs.some(e => e.name === c.name)) extraCelebs.unshift(c);
  pick = { name: c.name, style: pick.style };
  renderCarousel();
}

function setupHtml(p = {}) {
  // Re-seed the picker from the saved profile (a saved name that isn't in the list shows as an extra card).
  pick = { name: p.celebrity || "", style: p.style || "" };
  if (pick.name && !isListed(pick.name) && !extraCelebs.some(e => e.name === pick.name)) extraCelebs.unshift({ name: pick.name, wiki: pick.name, thumb: "" });
  const sel = (v, o) => o.map(([k, t]) => `<option value="${k}" ${p[v] === k ? "selected" : ""}>${t}</option>`).join("");
  return `<h1 class="rise">${p.age ? "Your profile" : "Welcome to <span class='grad-text'>Muse Coach</span>"}</h1>
    <p class="mute rise">Pick a celebrity style you admire. A coach built for that style takes it from here.</p>
    <div class="rise pickcol"><label>Style inspiration (swipe, then tap one)</label>
    <div id="carousel" class="carousel"></div>
    <label>Not here? Type a celebrity's name</label>
    <div class="row" style="align-items:stretch"><input id="csearch" placeholder="e.g. Gong Yoo" enterkeyhint="search"><button class="small" id="cfind" type="button" style="flex:0 0 auto">Find</button></div>
    <div id="cresults"></div>
    <div id="stylebox"></div>
    <p class="mute" style="margin:6px 0 0">Photos come from Wikipedia and Wikimedia Commons. The celebrity only picks your coach's style; your targets come from your own numbers.</p></div>
    <div class="card rise formcol">
    <div class="row"><div><label>Age</label><input id="age" type="number" inputmode="numeric" value="${p.age || ""}"></div>
    <div><label>Sex (calorie formula)</label><select id="sex">${sel("sex", [["female", "Female"], ["male", "Male"]])}</select></div></div>
    <label>Height</label>
    <div class="row"><input id="ft" type="number" inputmode="numeric" placeholder="ft" value="${p.height_cm ? cmToFtIn(p.height_cm).ft : ""}">
    <input id="inch" type="number" inputmode="numeric" placeholder="in" value="${p.height_cm ? cmToFtIn(p.height_cm).inch : ""}"></div>
    <label>Weight (lb)</label><input id="weight" type="number" inputmode="decimal" value="${p.weight_kg ? kgToLb(p.weight_kg) : ""}">
    <label>Goal</label><select id="goal">${sel("goal", [["lose", "Lose fat"], ["maintain", "Maintain"], ["build", "Build muscle"]])}</select>
    <label>Goal weight (lb, optional)</label><input id="gw" type="number" inputmode="decimal" value="${p.goal_weight_kg ? kgToLb(p.goal_weight_kg) : ""}">
    <label>Activity (sets how many workout days you get)</label><select id="act">${sel("activity", [["low", "Low (3 workouts a week)"], ["medium", "Medium (4 workouts a week)"], ["high", "High (5 workouts a week)"]])}</select></div>
    <div class="rise formcol">${window.museExtraHtml ? window.museExtraHtml() : ""}
    <div id="err"></div><button id="save" style="margin-top:14px">Save and meet my coach</button></div>`;
}
function wireSetup() {
  if (window.museWireExtra) window.museWireExtra();
  renderCarousel();
  wikiThumbs([...extraCelebs, ...celebs].map(c => c.wiki)).then(renderCarousel);
  $("#cfind").onclick = findCelebrity;
  $("#csearch").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); findCelebrity(); } };
  $("#save").onclick = async () => {
    const num = id => { const v = $(id).value; return v === "" ? null : parseFloat(v); };
    const ft = num("#ft"), inch = num("#inch") ?? 0, lb = num("#weight"), gwLb = num("#gw");
    const body = { age: parseInt($("#age").value, 10), sex: $("#sex").value, height_cm: ft === null ? null : ftInToCm(ft, inch),
      weight_kg: lb === null ? null : lbToKg(lb), goal: $("#goal").value, activity: $("#act").value,
      goal_weight_kg: gwLb === null ? null : lbToKg(gwLb), celebrity: pick.name, style: !pick.name || isListed(pick.name) ? "" : (pick.style || "athletic") };
    if ([body.age, body.height_cm, body.weight_kg].some(v => v === null || isNaN(v))) return showErr("Fill in age, height and weight.");
    try { state = await api("/api/profile", json("PUT", body)); tab = "coach"; animateNext = true; render(); window.scrollTo({ top: 0 }); } catch (err) { showErr(err.message); }
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; animateNext = true; if (state) { render(); window.scrollTo({ top: 0 }); app.focus({ preventScroll: true }); } });

// ---- entrance: the splash plays once per visit, then the page content rises in ----
(function intro() {
  const splash = $("#splash"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seen = false; try { seen = sessionStorage.getItem("muse.intro") === "1"; } catch { /* storage blocked: just play it */ }
  const done = () => { splash.remove(); document.body.classList.add("ready"); };
  if (reduce || seen) { done(); }
  else {
    try { sessionStorage.setItem("muse.intro", "1"); } catch { /* ignore */ }
    splash.addEventListener("animationend", e => { if (e.animationName === "splashOut") done(); });
    splash.addEventListener("click", done);
    setTimeout(done, 3200); // safety net if animations are blocked
    setTimeout(() => document.body.classList.add("ready"), 1750); // start the content rising as the splash fades
  }
})();
load();
</script>
